name: Build and Push Docker Images

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  OWNER: ycy-0510

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: client
            context: ./client
            image: typeblitz-client
          - name: server
            context: ./server
            image: typeblitz-server

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so the build id can count commits on the build day.
          fetch-depth: 0

      - name: Compute build id
        id: build
        run: |
          DAY=$(git show -s --format=%cd --date=format:%y%m%d HEAD)
          FULL=$(git show -s --format=%cd --date=format:%Y-%m-%d HEAD)
          N=$(git log --pretty=%cd --date=format:%Y-%m-%d | grep -c "^${FULL}$")
          echo "id=$(printf '%s.%02d' "$DAY" "$N")" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU (for multi-arch builds)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Each image consumes only the args its Dockerfile declares; the others
          # are ignored harmlessly. The same build id goes to both so they agree.
          # The Turnstile SITE key is public, so a repo Variable/Secret is fine.
          build-args: |
            VITE_TURNSTILE_SITE_KEY=${{ secrets.TURNSTILE_SITE_KEY }}
            VITE_BUILD=${{ steps.build.outputs.id }}
            BUILD=${{ steps.build.outputs.id }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
